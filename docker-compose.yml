services:
  db:
    image: postgres:15-alpine
    container_name: postgres_inventario
    environment:
      POSTGRES_USER: admin_app
      POSTGRES_PASSWORD: admin999
      POSTGRES_DB: multi_sucursal
      TZ: "America/Bogota"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_app -d multi_sucursal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red-inventario

  backend:
    build: ./back_gestion_inventario
    container_name: backend_fastapi
    command: sh -c "python -m core.migrate && python -m core.bootstrap && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./back_gestion_inventario:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin_app:admin999@db:5432/multi_sucursal
      - SECRET_KEY=e83a9d7c3b2f1a0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6
      - ALGORITHM=HS256
      - EXPIRATION_HOURS=8
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-InventarioLocal2026!}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-inventario

  frontend:
    build: ./front_sistema_inventario
    container_name: frontend_react
    ports:
      - "5173:5173"
    volumes:
      - ./front_sistema_inventario:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - red-inventario

volumes:
  pgdata:

networks:
  red-inventario:
    driver: bridge